<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03 // TEACHERS — STUDENT MANAGEMENT SYSTEM</title>
    <link rel="stylesheet" th:href="@{/css/brutalist.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-wrapper">
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="content-body">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="editorial-header">
                <div>
                    <h1 class="page-title">TEACHERS</h1>
                    <div class="page-subtitle">FACULTY DIRECTORY // ACADEMIC STAFF</div>
                </div>
                <div>
                    <a th:href="@{/teachers/new}" class="btn-brutal btn-brutal-primary">+ ADD TEACHER</a>
                </div>
            </div>

            <!-- Filter Bar -->
            <form th:action="@{/teachers}" method="get" class="filter-bar">
                <div style="flex: 1; min-width: 200px;">
                    <input type="text" name="search" th:value="${search}" placeholder="SEARCH TEACHER BY NAME, ID, EMAIL..." class="form-control-brutal mono">
                </div>
                <div>
                    <select name="departmentId" class="form-control-brutal mono" style="width: auto;">
                        <option value="">ALL DEPARTMENTS</option>
                        <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.code + ' - ' + d.name}" th:selected="${selectedDept == d.id}"></option>
                    </select>
                </div>
                <button type="submit" class="btn-brutal btn-brutal-primary">[ FILTER ]</button>
                <a th:href="@{/teachers}" class="btn-brutal">[ RESET ]</a>
            </form>

            <!-- Teachers Table -->
            <div class="table-container">
                <div class="table-header-bar">
                    <span class="table-title">FACULTY ROSTER // <span th:text="${totalElements}">0</span> TOTAL MEMBERS</span>
                </div>
                <table class="brutal-table">
                    <thead>
                        <tr>
                            <th>TEACHER ID</th>
                            <th>NAME</th>
                            <th>DESIGNATION</th>
                            <th>DEPARTMENT</th>
                            <th>EMAIL</th>
                            <th>SPECIALIZATION</th>
                            <th style="text-align: right;">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${teachers.content}">
                            <td class="mono font-weight-bold" th:text="${t.teacherId}">TCH2026001</td>
                            <td th:text="${t.fullName}">Dr. Alan Turing</td>
                            <td th:text="${t.designation}">Professor</td>
                            <td class="mono" th:text="${t.departmentName != null ? t.departmentName : '—'}">CSE</td>
                            <td class="mono" th:text="${t.email}">alan.turing@univ.edu</td>
                            <td th:text="${t.specialization != null ? t.specialization : 'General'}">Theory of Computation</td>
                            <td style="text-align: right; white-space: nowrap;">
                                <a th:href="@{'/teachers/edit/' + ${t.id}}" class="btn-brutal btn-brutal-sm btn-brutal-lime" style="margin-right: 4px;">EDIT</a>
                                <form th:action="@{'/teachers/delete/' + ${t.id}}" method="post" class="delete-form" style="display:inline;">
                                    <button type="submit" class="btn-brutal btn-brutal-sm btn-brutal-accent">DEL</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(teachers.content)}">
                            <td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted); font-family: var(--font-mono);">
                                NO TEACHER RECORDS FOUND.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
