<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>04 // DEPARTMENTS — STUDENT MANAGEMENT SYSTEM</title>
    <link rel="stylesheet" th:href="@{/css/brutalist.css}">
</head>
<body>
<div class="app-container">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main-wrapper">
        <div th:replace="~{fragments/header :: header}"></div>

        <div class="content-body">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="editorial-header">
                <div>
                    <h1 class="page-title">DEPARTMENTS</h1>
                    <div class="page-subtitle">ACADEMIC UNITS // FACULTIES & INSTITUTES</div>
                </div>
                <div>
                    <a th:href="@{/departments/new}" class="btn-brutal btn-brutal-primary">+ ADD DEPARTMENT</a>
                </div>
            </div>

            <!-- Department Grid / Table -->
            <div class="table-container">
                <div class="table-header-bar">
                    <span class="table-title">INSTITUTIONAL DIVISIONS // <span th:text="${totalElements}">0</span> TOTAL</span>
                </div>
                <table class="brutal-table">
                    <thead>
                        <tr>
                            <th>CODE</th>
                            <th>NAME</th>
                            <th>HEAD OF DEPARTMENT</th>
                            <th>CONTACT EMAIL</th>
                            <th>COURSES</th>
                            <th>FACULTY</th>
                            <th>STUDENTS</th>
                            <th style="text-align: right;">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${departments.content}">
                            <td class="mono font-weight-bold" th:text="${d.code}">CSE</td>
                            <td style="font-weight: 700;" th:text="${d.name}">Computer Science</td>
                            <td th:text="${d.headOfDepartment != null ? d.headOfDepartment : '—'}">Dr. Turing</td>
                            <td class="mono" th:text="${d.contactEmail != null ? d.contactEmail : '—'}">cse@univ.edu</td>
                            <td class="mono font-weight-bold" th:text="${d.courseCount}">4</td>
                            <td class="mono" th:text="${d.teacherCount}">12</td>
                            <td class="mono font-weight-bold" th:text="${d.studentCount}">320</td>
                            <td style="text-align: right; white-space: nowrap;">
                                <a th:href="@{'/departments/edit/' + ${d.id}}" class="btn-brutal btn-brutal-sm btn-brutal-lime" style="margin-right: 4px;">EDIT</a>
                                <form th:action="@{'/departments/delete/' + ${d.id}}" method="post" class="delete-form" style="display:inline;">
                                    <button type="submit" class="btn-brutal btn-brutal-sm btn-brutal-accent">DEL</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
