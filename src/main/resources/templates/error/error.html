<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ERROR // STUDENT MANAGEMENT SYSTEM</title>
    <link rel="stylesheet" th:href="@{/css/brutalist.css}">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;">
    <div style="max-width: 600px; width: 100%; border: var(--border-width) solid var(--border-main); background: #fff; padding: 48px; box-shadow: 8px 8px 0px var(--border-main);">
        <div class="mono" style="font-size: 14px; color: var(--accent-red); font-weight: 800; margin-bottom: 12px;" th:text="'[HTTP STATUS ' + ${status} + '] // ' + ${error}">
            [ERROR] // OPERATION FAILED
        </div>
        <h1 style="font-size: 40px; margin-bottom: 20px;" th:text="${error}">TRANSACTION ERROR</h1>
        <p style="font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); margin-bottom: 32px;" th:text="${message}">
            An error occurred during transaction processing.
        </p>
        <a th:href="@{/dashboard}" class="btn-brutal btn-brutal-primary">← RETURN TO DASHBOARD</a>
    </div>
</body>
</html>
